<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="ryadom-maintenance" content="true">
  <title>Скоро вернёмся — РЯДОМ</title>
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#061823}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#faf8f1;background:radial-gradient(ellipse at 18% 10%,#21495770,transparent 52%),radial-gradient(ellipse at 90% 90%,#bd925a20,transparent 48%),#061823}.pause-card{width:min(100%,590px);position:relative;text-align:center;border:1px solid #e7c57e38;border-radius:36px;padding:36px 36px 30px;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:0 24px 90px #00000030,inset 0 1px 0 #ffffff0c;backdrop-filter:blur(18px)}.brand{width:130px;height:auto;display:block;margin:0 auto}.sticker{display:block;width:clamp(160px,35vw,224px);height:auto;margin:30px auto 22px;filter:drop-shadow(0 12px 24px #00000024)}.eyebrow{margin:0 0 12px;color:#e9c986;font-size:11px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-size:clamp(27px,5.8vw,40px);font-weight:650;line-height:1.16;letter-spacing:-.035em;text-wrap:balance}.message{max-width:390px;margin:20px auto 0;color:#b6c5ce;font-size:16px;line-height:1.65}.return{display:block;margin-top:5px;color:#f2d28f}.thanks{margin:28px 0 0;color:#8fa4b0;font-size:12px}.contact{display:inline-block;margin-top:13px;padding:8px;color:#c3d1d8;font-size:12px;text-underline-offset:4px}.contact:hover{color:#f2d28f}.contact:focus-visible{outline:2px solid #f2d28f;outline-offset:4px;border-radius:5px}@media(max-width:420px){body{padding:20px 16px}.pause-card{border-radius:28px;padding:28px 21px 22px}.sticker{margin-top:24px;margin-bottom:20px}.message{font-size:15px}.thanks{margin-top:24px}}@media(max-height:600px) and (min-width:600px){body{padding:16px}.pause-card{padding:22px}.sticker{width:120px;margin:16px auto}.brand{width:100px}h1{font-size:30px}.message{margin-top:12px}.thanks{margin-top:16px}}
  </style>
</head>
<body>
  <main class="pause-card" aria-labelledby="pause-title">
    <img class="brand" src="/brand/ryadom-logo-winter-v2.svg" alt="РЯДОМ" width="260" height="100">
    <img class="sticker" src="/wall/stickers/sable-20.webp" alt="Наш соболь со значком геолокации: «Я рядом»" width="256" height="256">
    <p class="eyebrow">Ненадолго на паузе</p>
    <h1 id="pause-title">Друзья, сайт временно недоступен</h1>
    <p class="message">Готовим обновление для вас.<strong class="return">Скоро вернёмся!</strong></p>
    <p class="thanks">Спасибо, что остаётесь рядом.</p>
    <a class="contact" href="mailto:Mewars@yandex.ru">Связаться с нами</a>
  </main>
</body>
</html>
