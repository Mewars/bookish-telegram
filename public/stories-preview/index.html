<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1c2a"><title>Пример историй — РЯДОМ</title><link rel="icon" href="/brand/pin-yellow.svg"><link rel="stylesheet" href="/stories/preview.css?v=20261026a"><style>body{margin:0;background:#091824;color:#edf1f3;font:16px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;gap:20px;justify-content:space-between;border-bottom:1px solid #ffffff20;padding-bottom:24px;margin-bottom:32px}a{color:#e4bd70;text-decoration:none}.logo{font-size:28px;font-weight:800;letter-spacing:.04em}h1{font-size:clamp(25px,5vw,38px);margin:0 0 26px}.sample-feed{padding:24px;background:#112837;border:1px solid #ffffff20;border-radius:18px;margin-top:10px}.sample-feed p{color:#bbc8d2;line-height:1.6}.sample-feed img{width:100%;max-height:360px;object-fit:cover;border-radius:12px}.preview-links{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0;line-height:1.7}.preview-links a{border-bottom:1px solid #e4bd7077}small{color:#a8b6c3}</style></head><body><main><header><a class="logo" href="/#/home">РЯДОМ <span style="color:#e4bd70">⌖</span></a><small>Пример оформления</small></header><h1>Городская лента</h1><section id="stories"></section><nav class="preview-links" aria-label="Посмотреть истории на сайте"><a id="on-home">Посмотреть на главной</a><a id="on-wall">Посмотреть над стеной</a></nav><article class="sample-feed"><small>Пример записи · не публикация жителя</small><h2>Красота рядом</h2><p>Здесь останется привычная городская лента. Истории будут отдельной полосой над ней.</p><img id="feed-photo" alt="Пример фотографии для городской ленты"></article></main><script type="module">import {mountStoriesPreview} from '/stories/preview.js?v=20261026a';const city=new URLSearchParams(location.search).get('city')||'Енисейск';mountStoriesPreview(document.getElementById('stories'),{city});document.getElementById('on-home').href='/?stories=preview#/home?'+new URLSearchParams({city});document.getElementById('on-wall').href='/wall/?'+new URLSearchParams({city,stories:'preview'});document.getElementById('feed-photo').src='/brand/discovery/'+(city==='Енисейск'?'eniseysk-':'')+'park.webp';</script></body></html>
