<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <script>
      // Resolve the theme before stylesheets and React can paint the page.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('ryadom.theme');
          var value = raw;
          try { value = JSON.parse(raw); } catch { /* Legacy unquoted value. */ }
          if (value === 'light' || value === 'dark' || value === 'system') theme = value;
        } catch { /* Unavailable storage uses system preference. */ }
        var compact = !!(window.matchMedia && window.matchMedia('(max-width: 899px)').matches);
        var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = compact || (theme === 'dark') || (theme === 'system' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      }());
    </script>
    <style>
      /* Only the initial canvas; keep these colors in sync with styles/tokens.css. */
      :root { --bg: #071622; --text: #FFF8E9; background: var(--bg); color: var(--text); color-scheme: dark; }
      :root[data-theme=light] { --bg: #FAF7EF; --text: #0B1C29; color-scheme: light; }
      body { margin: 0; background: var(--bg); }
    </style>
    <meta name="theme-color" content="#071622"/>
