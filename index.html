    <script>
      // Resolve the theme before stylesheets and React can paint the page.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('ryadom.theme');
          var value = raw;
          try { value = JSON.parse(raw); } catch { /* Legacy unquoted value. */ }
          if (value === 'light' || value === 'dark' || value === 'system') theme = value;
        } catch { /* Unavailable storage uses system preference. */ }
        var compact = !!(window.matchMedia && window.matchMedia('(max-width: 899px)').matches);
        var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = compact || (theme === 'dark') || (theme === 'system' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      }());
    </script>
    <script id="city-cover-preload">
      // Start the homepage image before downloading and running the React chunks.
      (function () {
        var route = window.location.hash.split('?')[0];
        if (route && route !== '#/' && route !== '#/home') return;
        var city = 'Енисейск';
        try {
          var saved = JSON.parse(localStorage.getItem('ryadom.city'));
          if (typeof saved === 'string' && saved) city = saved;
        } catch { /* The default city works without browser storage. */ }
        var requested = new URLSearchParams(window.location.hash.split('?')[1] || '').get('city');
        if (requested) city = requested;
        var covers = {
          'Енисейск': 'yeniseysk-winter-churches',
          'Лесосибирск': 'lesosibirsk-winter-v2',
          'Красноярск': 'krasnoyarsk-winter-v1'
        };
        if (!Object.hasOwn(covers, city)) return;
        var hour = Number(new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Krasnoyarsk', hour: '2-digit', hourCycle: 'h23'
        }).format(new Date()));
        var image = document.createElement('link');
        image.rel = 'preload';
        image.as = 'image';
        image.fetchPriority = 'high';
        image.href = '%BASE_URL%brand/' + covers[city] + (hour >= 19 || hour < 9 ? '-on.webp' : '-off.webp');
        document.head.appendChild(image);
      }());
    </script>

      :root[data-theme=light] { --bg: #FAF7EF; --text: #0B1C29; color-scheme: light; }
