name: Read public host branding sources
on:
  push:
    branches: [brand/vstrechay-platform]
    paths: [.github/workflows/brand-source-audit.yml]
permissions:
  contents: read
jobs:
  public-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public static brand sources without authentication
        run: |
          mkdir -p public-snapshot
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse
          from html.parser import HTMLParser
          base='https://ryadomcity.ru'
          queue=['/','/app.webmanifest','/pwa/register.js','/pwa/sw.js','/sw.js','/service-worker.js','/notifications/','/donate/','/profile/','/auth/','/owner/','/reviews/','/admin/']
          seen=set(); report=[]
          class Links(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs); value=attrs.get('src') if tag=='script' else attrs.get('href') if tag=='link' else None
                  if not value:return
                  url=urllib.parse.urlsplit(urllib.parse.urljoin(current,value))
                  if url.netloc!='ryadomcity.ru' or url.path.startswith('/assets/') or 'supabase-client' in url.path:return
                  if url.path.endswith(('.js','.css','.webmanifest')):queue.append(url.path)
          while queue and len(seen)<65:
              path=queue.pop(0)
              if path in seen:continue
              seen.add(path); current=base+path
              try:
                  with urllib.request.urlopen(current,timeout=20) as response:
                      data=response.read(1000000); content_type=response.headers.get('Content-Type','')
                  target=pathlib.Path('public-snapshot')/path.lstrip('/')
                  if path.endswith('/') or path=='/':target=target/'index.html'
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  report.append({'path':path,'bytes':len(data),'content_type':content_type})
                  if 'html' in content_type:Links().feed(data.decode('utf-8',errors='replace'))
              except Exception as error:report.append({'path':path,'error':str(error)})
          pathlib.Path('public-snapshot/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-brand-sources
          path: public-snapshot/
          retention-days: 3
