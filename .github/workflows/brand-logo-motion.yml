name: Brand Logo Motion

on:
  pull_request:
    branches: [mewars]
    paths:
      - 'src/components/BrandLogo.tsx'
      - 'src/components/brandLogo.css'
      - 'public/brand/vstrechay-pin-favicon.svg'
      - 'index.html'
      - 'tests/brand-logo-browser.py'
      - 'tests/header-brand-cookie.test.mjs'
      - '.github/workflows/brand-logo-motion.yml'

permissions:
  contents: read

jobs:
  brand-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Install Chromium for Playwright
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify arrival and periodic hops across desktop and mobile
        run: |
          npm run dev -- --host 127.0.0.1 --port 4178 --strictPort > "$RUNNER_TEMP/brand-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/brand-logo-browser.py http://127.0.0.1:4178/
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-motion-screenshots
          path: work/scarivo-*.png
          retention-days: 14
          if-no-files-found: warn
