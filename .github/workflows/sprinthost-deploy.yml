name: Deploy Ryadom to Sprinthost

on:
  push:
    branches: [mewars]
  workflow_dispatch:

permissions:
  contents: read

# Never publish an unreviewed PR. A site owner must deliberately opt in via
# repository variable SPRINTHOST_DEPLOY_ENABLED=true after configuring SSH.
concurrency:
  group: sprinthost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/mewars' && vars.SPRINTHOST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CONTEXT: production
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ADMIN_PANEL_ENABLED: ${{ vars.RYADOM_CMS_SAFETY_OFF == 'true' && 'false' || 'true' }}
      VITE_CARD_PHOTOS_ENABLED: ${{ vars.VITE_CARD_PHOTOS_ENABLED || 'false' }}
      VITE_CITY_DIRECTORY_ENABLED: ${{ vars.RYADOM_CMS_SAFETY_OFF == 'true' && 'false' || 'true' }}
      VITE_ORGANIZATIONS_ENABLED: ${{ vars.RYADOM_CMS_SAFETY_OFF == 'true' && 'false' || 'true' }}
      VITE_VK_ID_ENABLED: 'true'
      SPRINTHOST_HOST: ${{ secrets.SPRINTHOST_SSH_HOST }}
      SPRINTHOST_USER: ${{ secrets.SPRINTHOST_SSH_USER }}
      SPRINTHOST_SSH_PRIVATE_KEY: ${{ secrets.SPRINTHOST_SSH_PRIVATE_KEY }}
      SPRINTHOST_SSH_KNOWN_HOSTS: ${{ secrets.SPRINTHOST_SSH_KNOWN_HOSTS }}
      SPRINTHOST_SSH_PORT: ${{ vars.SPRINTHOST_SSH_PORT || '22' }}
      DEPLOY_ROOT: /home/mewars/domains/ryadomcity.ru/public_html
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and test
        run: |
          npm run lint
          npm test
      - name: Check public Supabase configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "::error::Expected public Supabase key"; exit 1;; esac
      - name: Build verified release
        run: npm run build
      - name: Check release version and site entry point
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/.htaccess
          test -d dist/assets
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/version.json','utf8')).version")" = "$GITHUB_SHA"
          grep -q 'name="ryadom-build-version"' dist/index.html
          echo "Validated release $GITHUB_SHA"
      - name: Set up SSH credentials (strict host key check)
        shell: bash
        run: |
          set -euo pipefail
          for required in SPRINTHOST_HOST SPRINTHOST_USER SPRINTHOST_SSH_PRIVATE_KEY SPRINTHOST_SSH_KNOWN_HOSTS; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required — deployment cancelled"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SPRINTHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/ryadom-deploy-key"
          chmod 600 "$HOME/.ssh/ryadom-deploy-key"
          printf '%s\n' "$SPRINTHOST_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/ryadom-deploy-key" > /dev/null
      - name: Verify the exact destination before writing
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ryadom-deploy-key" -p "$SPRINTHOST_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SPRINTHOST_USER@$SPRINTHOST_HOST" \
            "test -d '$DEPLOY_ROOT' && test -f '$DEPLOY_ROOT/index.html' && test \"\$(cd '$DEPLOY_ROOT' && pwd -P)\" = '$DEPLOY_ROOT'"
      - name: Upload static files before switching HTML
        shell: bash
        run: |
          set -euo pipefail
          SSH_RSYNC="ssh -i $HOME/.ssh/ryadom-deploy-key -p $SPRINTHOST_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          DEST="$SPRINTHOST_USER@$SPRINTHOST_HOST:$DEPLOY_ROOT/"
          # No --delete: preserve the old hashed assets for tabs opened during deployment,
          # and do not touch host-managed folders or the owner's manual ZIP backup.
          rsync -az --delay-updates --no-perms --no-owner --no-group -e "$SSH_RSYNC" \
            --exclude='/index.html' --exclude='/version.json' dist/ "$DEST"
          # Last, atomically switch to the new HTML entry point and publish its version.
          rsync -az --delay-updates --no-perms --no-owner --no-group -e "$SSH_RSYNC" dist/index.html "$DEST"
          rsync -az --delay-updates --no-perms --no-owner --no-group -e "$SSH_RSYNC" dist/version.json "$DEST"
      - name: Verify server release ID
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ryadom-deploy-key" -p "$SPRINTHOST_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SPRINTHOST_USER@$SPRINTHOST_HOST" \
            "grep -Fq '$GITHUB_SHA' '$DEPLOY_ROOT/version.json' && test -s '$DEPLOY_ROOT/index.html'"
          echo "Ryadom deployed successfully: $GITHUB_SHA"
