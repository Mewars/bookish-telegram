name: Published Home Browser QA

on:
  workflow_run:
    workflows: ["Deploy Ryadom to Sprinthost"]
    branches: [mewars]
    types: [completed]

permissions:
  contents: read

jobs:
  live-home-check:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'mewars' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runner
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Audit real production homepage (desktop and mobile)
        run: node scripts/check-published-home.mjs
        env:
          RYADOM_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-home-browser-qa
          path: qa-screenshots/
          retention-days: 14
          if-no-files-found: warn
