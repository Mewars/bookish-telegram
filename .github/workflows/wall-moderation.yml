name: Wall Resident Moderation
on:
  pull_request:
    branches: [mewars]
    paths: ['public/security/**', 'host-public/wall/**', 'src/community/**', 'docs/sql/community-review-reasons-v1.sql', 'tests/community-review*', 'tests/host-wall*', '.github/workflows/wall-moderation.yml']
permissions:
  contents: read
jobs:
  wall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate standalone module and private reason permissions
        run: |
          node --check host-public/wall/app.js
          node --test tests/host-wall-moderation.test.mjs tests/wall-expressions.test.mjs
          node --test tests/community-review-reasons.test.mjs
      - name: Install isolated browser runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test actual wall module with synthetic accounts
        run: |
          cp -R public/security host-public/security
          python -m http.server 4176 --bind 127.0.0.1 --directory host-public > "$RUNNER_TEMP/wall-test.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4176/wall/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/host-wall-browser.py
      - name: Save sticker picker and moderation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-stickers-browser-qa
          path: qa-wall-stickers/
          retention-days: 14
          if-no-files-found: warn
