name: Public Catalog Navigation Browser

on:
  pull_request:
    branches: [mewars]
    paths:
      - 'src/App.tsx'
      - 'src/navigation/**'
      - 'src/hooks/useRoute.ts'
      - 'src/hooks/useCity.ts'
      - 'src/pages/CatalogPage.tsx'
      - 'tests/public-catalog-navigation*'
      - '.github/workflows/public-navigation-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:navigation
      - name: Build public fallback app without cloud credentials
        run: npm run build
        env:
          VITE_ADMIN_PANEL_ENABLED: 'false'
          VITE_CITY_DIRECTORY_ENABLED: 'false'
          VITE_ORGANIZATIONS_ENABLED: 'false'
          VITE_CARD_PHOTOS_ENABLED: 'false'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test mobile and desktop navigation without external APIs
        run: |
          python -m http.server 4175 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/navigation-server.log" 2>&1 &
          navigation_pid=$!
          trap 'kill "$navigation_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/public-catalog-navigation-browser.py
