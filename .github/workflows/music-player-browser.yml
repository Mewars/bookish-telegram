name: Music Player and Host Shell
on:
  pull_request:
    branches: [mewars]
    paths: ['src/music/**', 'host-public/ui/site-shell.js', 'scripts/preserve-host-extensions.py', 'tests/music-*', 'tests/preserve-host-extensions.py', '.github/workflows/music-player-browser.yml']
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:music
      - run: python tests/preserve-host-extensions.py
      - name: Build public app with offline fallback data
        run: npm run build
        env:
          VITE_ADMIN_PANEL_ENABLED: 'false'
          VITE_CITY_DIRECTORY_ENABLED: 'false'
          VITE_ORGANIZATIONS_ENABLED: 'false'
          VITE_CARD_PHOTOS_ENABLED: 'false'
      - name: Install isolated browser runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test real player and host shell with synthetic audio events
        run: |
          python -m http.server 4177 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/music-test.log" 2>&1 &
          music_pid=$!
          trap 'kill "$music_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4177/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/music-shell-browser.py
