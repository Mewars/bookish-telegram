name: Anti-spam Security and UI
on:
  pull_request:
    branches: [mewars]
    paths: ['public/security/**', 'supabase/functions/ryadom-antispam/**', 'docs/sql/antispam-turnstile-v1.sql', 'src/pages/LoginPage.tsx', 'src/organizations/OrganizationsPage.tsx', 'tests/antispam*', '.github/workflows/antispam-browser.yml']
permissions:
  contents: read
jobs:
  antispam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:antispam
      - run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check synthetic widget without external traffic or real users
        run: |
          npm run dev -- --host 127.0.0.1 --port 4178 --strictPort > "$RUNNER_TEMP/antispam-vite.log" 2>&1 &
          antispam_pid=$!
          trap 'kill "$antispam_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/antispam-browser.py
