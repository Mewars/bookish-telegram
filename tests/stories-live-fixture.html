<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/stories/preview.css"><style>body{background:#091824;color:white;font:16px system-ui;margin:20px}button,select{min-height:44px}main{max-width:1100px;margin:30px auto}</style></head><body><label>Тестовый пользователь <select id="actor"><option value="guest">Гость</option><option value="resident">Житель</option><option value="editor">Модератор А</option><option value="owner">Владелец</option></select></label><label>Тестовый город <select id="city"><option>Город А</option><option>Город Б</option></select></label><main id="stories"></main><script type="module">import {mountCityStories} from '../public/stories/live.js';import {client,setActor} from '/tests/stories-live-sdk.mjs';let dispose;function mount(){dispose?.();dispose=mountCityStories(document.getElementById('stories'),{city:document.getElementById('city').value,client});}document.getElementById('actor').onchange=e=>setActor(e.target.value);document.getElementById('city').onchange=mount;mount();</script></body></html>
